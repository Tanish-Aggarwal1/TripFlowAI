<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>TripFlowAI</title>

  <!--
    Second layer of XSS defense for the localStorage-held JWT (SCRUM-416 / M-8).
    frame-ancestors, X-Frame-Options, X-Content-Type-Options and Referrer-Policy are NOT
    honoured via <meta> — those are set as real response headers in Render's dashboard
    (see docs/deployment/frontend-setup.md#security-headers). This meta CSP covers what
    it can: default-src/script-src/connect-src/img-src/object-src, which is the part that
    actually blocks token exfiltration on injection.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://res.cloudinary.com data: blob:; connect-src 'self' https://tripflowai.onrender.com https://api.mapbox.com https://events.mapbox.com https://api.cloudinary.com; object-src 'none'; base-uri 'self';" />

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0054e9" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
