<div class="trip-map-wrapper">

    <div class="trip-map-actions">
    <ion-button
      size="small"
      [disabled]="optimizing || !canOptimize"
      [title]="canOptimize ? 'Recalculate the optimal stop order' : 'Add at least 2 stops to optimize the route'"
      (click)="requestOptimize()">
      @if (optimizing) {
        <ion-spinner name="crescent" slot="start"></ion-spinner>
        Optimizing...
      } @else {
        <ion-icon slot="start" name="navigate"></ion-icon>
        Optimize Route
      }
    </ion-button>
    @if (!canOptimize) {
      <p class="optimize-hint">Add at least 2 stops to optimize the route.</p>
    }
  </div>
  <div #mapContainer class="trip-map-container"></div>

  @if (mapFailed) {
    <div class="trip-map-fallback">
      <p>Map couldn't load. Showing stop list instead.</p>
      <ion-button size="small" (click)="retry()">Retry</ion-button>
      <ol class="fallback-stop-list">
        @for (stop of sortedStops; track stop.id) {
          <li>{{ stop.name }}</li>
        }
      </ol>
    </div>
  }
</div>
