<ion-item lines="none">
  <ion-label>
    <h2>Add a photo</h2>
  </ion-label>
</ion-item>

<div class="upload-body">
  <input
    type="file"
    accept="image/*"
    capture="environment"
    (change)="onFileSelected($event)"
    [disabled]="uploading"
  />

  @if (previewUrl) {
    <img [src]="previewUrl" class="preview" alt="Selected photo preview" />
  }

  <ion-item>
    <ion-textarea
      label="Caption / note"
      labelPlacement="stacked"
      [(ngModel)]="caption"
      [disabled]="uploading"
      placeholder="Say something about this stop..."
      autoGrow="true"
    ></ion-textarea>
  </ion-item>

  @if (uploading) {
    <ion-progress-bar [value]="progress / 100"></ion-progress-bar>
  }

  @if (formError) {
    <p class="form-error" role="alert">{{ formError }}</p>
  }

  <div class="actions">
    <ion-button fill="clear" (click)="cancel()" [disabled]="uploading">
      <ion-icon slot="start" name="close"></ion-icon>
      Cancel
    </ion-button>
    <ion-button (click)="submit()" [disabled]="uploading || !selectedFile">
      @if (uploading) {
        <ion-spinner name="crescent" slot="start"></ion-spinner>
      }
      @if (!uploading) {
        <ion-icon slot="start" name="checkmark"></ion-icon>
      }
      Upload
    </ion-button>
  </div>
</div>
