<div class="ai-preferences-form">
  <h3>Tell Gemini about this trip</h3>

  <app-interest-chips
    label="Interests"
    [interests]="interests"
    (interestsChange)="interests = $event"
  ></app-interest-chips>

  <ion-item>
    <ion-select label="Budget" labelPlacement="stacked" [(ngModel)]="budget" interface="popover">
      <ion-select-option value="low">Low</ion-select-option>
      <ion-select-option value="medium">Medium</ion-select-option>
      <ion-select-option value="high">High</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-select label="Pace" labelPlacement="stacked" [(ngModel)]="pace" interface="popover">
      <ion-select-option value="relaxed">Relaxed</ion-select-option>
      <ion-select-option value="moderate">Moderate</ion-select-option>
      <ion-select-option value="packed">Packed</ion-select-option>
    </ion-select>
  </ion-item>

  @if (formError) {
    <p class="form-error" role="alert">{{ formError }}</p>
  }

  <div class="actions">
    <ion-button fill="clear" (click)="cancel()" [disabled]="submitting">Cancel</ion-button>
    <ion-button (click)="submit()" [disabled]="submitting">
      @if (submitting) {
        <ion-spinner name="dots" slot="start"></ion-spinner>
        Generating...
      } @else {
        <ion-icon name="sparkles" slot="start"></ion-icon>
        Get Suggestions
      }
    </ion-button>
  </div>
</div>
