<ion-item>
  <ion-input
    [attr.label]="label"
    labelPlacement="stacked"
    [(ngModel)]="interestInput"
    placeholder="e.g. food, hiking, museums"
    (keyup.enter)="addInterest()"
  ></ion-input>
</ion-item>
<ion-button fill="clear" size="small" (click)="addInterest()">Add interest</ion-button>

@if (interests.length > 0) {
  <div class="chip-row">
    @for (interest of interests; track interest) {
      <ion-chip>
        {{ interest }}
        <ion-button
          fill="clear"
          size="small"
          [attr.aria-label]="'Remove ' + interest"
          (click)="removeInterest(interest)"
        >
          <ion-icon slot="icon-only" name="close-circle"></ion-icon>
        </ion-button>
      </ion-chip>
    }
  </div>
}

@if (error) {
  <p class="form-error" role="alert">{{ error }}</p>
}
