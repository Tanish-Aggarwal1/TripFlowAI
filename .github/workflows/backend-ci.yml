name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  backend:
    runs-on: ubuntu-latest
    # Testcontainers starts a real Postgres here. A container that never becomes
    # healthy, or a stalled image pull, hangs rather than fails — without this the
    # job inherits GitHub's 6-hour default and leaves the required check pending,
    # so the PR can neither merge nor report a failure.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash mvnw -B verify -Pci

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Post JaCoCo PR comment
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend coverage
          # Baseline measured 2026-07-26 from several consecutive green backend-ci runs
          # (PRs #118, #120, #121): overall coverage consistently ~96%. Set a few points
          # below the measured number per SCRUM-136's original guidance — see docs/ci.md
          # for the full measurement and how to re-verify/adjust this later.
          min-coverage-overall: 92
          min-coverage-changed-files: 80
          update-comment: true