name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs on PR branches. On main, cancelling would leave
  # a merged commit with no recorded CI verdict if a second merge lands quickly
  # after the first — Render auto-deploys from main independently of this check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Only pull-requests: write is needed — the JaCoCo step posts a PR comment,
  # nothing here creates or updates a check run.
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    # Testcontainers starts a real Postgres here. A container that never becomes
    # healthy, or a stalled image pull, hangs rather than fails — without this the
    # job inherits GitHub's 6-hour default and leaves the required check pending,
    # so the PR can neither merge nor report a failure.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash mvnw -B verify -Pci

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Post JaCoCo PR comment
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend coverage
          # Baseline measured 2026-07-26 from several consecutive green backend-ci runs
          # (PRs #118, #120, #121): overall coverage consistently ~96%. Set a few points
          # below the measured number per SCRUM-136's original guidance — see docs/ci.md
          # for the full measurement and how to re-verify/adjust this later.
          min-coverage-overall: 92
          min-coverage-changed-files: 80
          update-comment: true

  # Informational only, not a required status check (adding one needs a manual
  # branch-protection change, out of scope here). Proves the production image
  # still builds on every PR — no push, no registry credentials.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend