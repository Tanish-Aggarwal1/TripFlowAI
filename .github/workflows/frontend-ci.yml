name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Mapbox secret is set
        run: |
          if [ -z "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "::error::MAPBOX_TOKEN secret is not set in repo settings"
            exit 1
          fi

      - name: Inject Mapbox token
        run: |
          sed -i "s|__MAPBOX_TOKEN__|${{ secrets.MAPBOX_TOKEN }}|g" src/environments/environment.ts
          sed -i "s|__MAPBOX_TOKEN__|${{ secrets.MAPBOX_TOKEN }}|g" src/environments/environment.prod.ts

      - name: Inject prod API base URL
        # Not a hard requirement (unlike Mapbox) — SCRUM-73 hasn't provisioned a real
        # backend URL yet, so API_BASE_URL isn't set as a repo secret. Once it is,
        # this substitutes it automatically; until then the placeholder is left as-is,
        # which is harmless here since this workflow only builds for verification and
        # never ships the artifact.
        run: |
          if [ -n "${{ secrets.API_BASE_URL }}" ]; then
            sed -i "s|__API_BASE_URL__|${{ secrets.API_BASE_URL }}|g" src/environments/environment.prod.ts
          else
            echo "::warning::API_BASE_URL secret not set — leaving __API_BASE_URL__ placeholder in environment.prod.ts (fine for CI verification builds; set this secret before an actual production build/deploy)."
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karma-coverage-report
          path: frontend/coverage/app/
          retention-days: 14

      - name: Post coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'frontend/coverage/app/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage-summary.json found, skipping comment.');
              return;
            }
            const t = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
            const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            const marker = '<!-- frontend-coverage-comment -->';
            const body = [
              marker,
              '### Frontend Coverage (Karma)',
              '',
              '| Metric | Coverage |',
              '|---|---|',
              `| Statements | ${pct(t.statements)} |`,
              `| Branches | ${pct(t.branches)} |`,
              `| Functions | ${pct(t.functions)} |`,
              `| Lines | ${pct(t.lines)} |`,
              '',
              '_Full HTML report attached as a workflow artifact._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }