name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-progress runs on PR branches — see backend-ci.yml for why main is exempt.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Only pull-requests: write is needed — the coverage step posts a PR comment,
  # nothing here creates or updates a check run.
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Mapbox secret is set
        run: |
          if [ -z "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "::error::MAPBOX_TOKEN secret is not set in repo settings"
            exit 1
          fi

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:ci

      # Injected only now, after tests: `npm run build` uses the "production"
      # config, whose fileReplacements swap environment.ts -> environment.prod.ts
      # (angular.json), so environment.ts never needs the real token at all.
      # test:ci has no fileReplacements and reads environment.ts's placeholder
      # directly — injecting earlier baked the live secret into Istanbul's HTML
      # coverage report, which is uploaded as a public 14-day artifact below
      # (SCRUM-450).
      - name: Inject Mapbox token
        run: |
          sed -i "s|__MAPBOX_TOKEN__|${{ secrets.MAPBOX_TOKEN }}|g" src/environments/environment.prod.ts

      - name: Inject prod API base URL
        # Not a hard requirement (unlike Mapbox) — SCRUM-73's backend is live
        # (https://tripflowai.onrender.com, see docs/deployment/frontend-setup.md),
        # but the actual production frontend build/deploy runs through Render's own
        # build env vars, not this workflow, so the API_BASE_URL repo secret was
        # never provisioned here. If it is set, this substitutes it automatically;
        # until then the placeholder is left as-is, which is harmless here since
        # this workflow only builds for verification and never ships the artifact.
        run: |
          if [ -n "${{ secrets.API_BASE_URL }}" ]; then
            sed -i "s|__API_BASE_URL__|${{ secrets.API_BASE_URL }}|g" src/environments/environment.prod.ts
          else
            echo "::warning::API_BASE_URL secret not set — leaving __API_BASE_URL__ placeholder in environment.prod.ts (fine for CI verification builds; set this secret before an actual production build/deploy)."
          fi

      - run: npm run build

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karma-coverage-report
          path: frontend/coverage/app/
          retention-days: 14

      - name: Post coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'frontend/coverage/app/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage-summary.json found, skipping comment.');
              return;
            }
            const t = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
            const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            const marker = '<!-- frontend-coverage-comment -->';
            const body = [
              marker,
              '### Frontend Coverage (Karma)',
              '',
              '| Metric | Coverage |',
              '|---|---|',
              `| Statements | ${pct(t.statements)} |`,
              `| Branches | ${pct(t.branches)} |`,
              `| Functions | ${pct(t.functions)} |`,
              `| Lines | ${pct(t.lines)} |`,
              '',
              '_Full HTML report attached as a workflow artifact._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }