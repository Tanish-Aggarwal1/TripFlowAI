spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
spring.profiles.default=dev
# SCRUM-249: app never defines a UserDetailsService/AuthenticationManager bean (JwtAuthFilter
# sets the SecurityContext directly), so suppress Spring Security's auto-generated in-memory
# user - dead bean, log noise. Property form (not the @SpringBootApplication exclude attribute)
# so it's also honored by @WebMvcTest slices, which don't inherit that annotation attribute.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Server
# Render (and most PaaS platforms) inject PORT and expect the app to bind to it;
# default to 8080 for local/Docker-only runs where PORT isn't set.
server.port=${PORT:8080}

# Database (local dev Pratham will add cloud values later)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# SCRUM-210: without this, Spring keeps the Hikari connection bound for the whole
# request (not just the @Transactional method), compounding the connection-pool
# exhaustion the AI/optimize endpoints were causing. Any lazy-loading exception this
# surfaces is a genuine latent bug — fix it by widening the relevant @EntityGraph,
# never by reverting this flag.
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
# 15 minutes (D-02) — short because it's now backed by silent refresh via the cookie below.
# Production sets JWT_EXPIRY_MS explicitly in the Render dashboard, so changing this default
# alone does NOT change the deployed lifetime; the dashboard value must be updated too.
app.jwt.expiration-ms=${JWT_EXPIRY_MS:900000}

# Refresh tokens
# 30 days, fixed from issuance rather than sliding (D-07): rotation re-issues on every refresh,
# so an active session survives indefinitely and this really bounds how long a user may be away
# before re-login — which a stolen-but-unused token must not be able to extend.
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRY_DAYS:30}
# Secure/SameSite are env-overridable only because local `ionic serve` runs over plain HTTP.
# Browsers treat localhost as a trustworthy origin so the defaults should work there too; the
# knobs exist for a dev whose browser disagrees. Production must never override them.
app.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.refresh-token.cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}
# The cookie name is not a property: AuthController reads it through @CookieValue, whose
# annotation argument must be a compile-time constant. A bound property would be writable but
# not readable, so overriding it would make the server issue one cookie and look for another —
# silently, with a 401 on every refresh and nothing logged.
app.refresh-token.cookie-path=/api/auth

# OpenRouteService (key in .env - quota: 500 req/day on free tier)
ors.base-url=https://api.openrouteservice.org
ors.api-key=${ORS_API_KEY}
ors.connect-timeout=5s
ors.read-timeout=15s

# Mapbox Static Images API (EXPORT-02 / D-03) — server-side PDF map snapshot, backend-scoped
# token distinct from the frontend's browser-scoped Mapbox token. Empty default (no MAPBOX_TOKEN
# set) is load-bearing: PDF export must degrade to a map-less document, not fail app startup.
mapbox.base-url=https://api.mapbox.com
mapbox.access-token=${MAPBOX_TOKEN:}
mapbox.style=streets-v12
mapbox.connect-timeout=5s
mapbox.read-timeout=10s

# HTTP
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# Pagination: @PageableDefault(size = 20) on the paged controllers sets only the
# *default* page size, not a ceiling — without this, a caller can request
# ?size=2000 (Spring Data's own default cap). That matters most on
# /api/discovery/**, which is unauthenticated — /search has its own rate limit below
# (SCRUM-493), but /trips still has none. Spring clamps oversized requests silently
# rather than erroring.
spring.data.web.pageable.max-page-size=100

# Actuator Health
management.endpoints.web.exposure.include=health,metrics
# Explicit disable — belt-and-braces against future Boot defaults changing:
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump,configprops
management.endpoint.health.show-details=never

# Gemini
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-flash-lite-latest
app.gemini.connect-timeout=5s
app.gemini.read-timeout=30s

# OpenAPI / Swagger UI (REF-23)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Per-user rate limits on paid external-API endpoints (SCRUM-173)
app.ratelimit.ai-suggest.capacity=10
app.ratelimit.ai-suggest.window=1h
app.ratelimit.optimize.capacity=20
app.ratelimit.optimize.window=1h
# Lower than ai-suggest since this call also persists a trip, not just suggests
app.ratelimit.ai-generate.capacity=5
app.ratelimit.ai-generate.window=1h
# Per-IP limits on the unauthenticated auth endpoints — mitigates credential
# stuffing / brute force (login) and automated account creation (register)
app.ratelimit.login.capacity=10
app.ratelimit.login.window=1h
app.ratelimit.register.capacity=5
app.ratelimit.register.window=1h
# /api/auth/refresh needs its own cap for two reasons: it is reachable with only a cookie and no
# access token, and replaying one stale token repeatedly force-logs-out its owner (reuse detection
# revokes every session), so an uncapped refresh endpoint is itself a denial-of-service weapon.
# 60/hour is ~15x what a legitimate 15-minute-token client needs, leaving headroom for many users
# sharing one NAT'd address.
app.ratelimit.refresh.capacity=60
app.ratelimit.refresh.window=1h
# /api/discovery/search is unauthenticated and not covered by Spring Security, and each hit runs
# an unindexed ILIKE scan over every PUBLIC trip (SCRUM-493) — capped per-IP same as the auth
# endpoints above. 60/hour is generous for real browsing (~1/min) while bounding sustained scans.
app.ratelimit.discovery-search.capacity=60
app.ratelimit.discovery-search.window=1h

# Heuristic day/time stop scheduling (SCRUM-244a) — the window each trip day allows,
# and how long a stop visit is assumed to take when spacing stops within that window.
app.schedule.day-start-time=09:00
app.schedule.day-end-time=21:00
app.schedule.default-visit-duration=1h

# No defaults here, unlike the other secrets in this file — see application-dev.properties
# for the dev placeholders. A default here would let production silently boot with it if
# application-prod.properties ever stopped re-declaring these (SCRUM-461).
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}