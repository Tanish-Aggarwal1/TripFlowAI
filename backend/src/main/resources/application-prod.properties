# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5


spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.tripflow.backend=INFO

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:3600000}

# OpenRouteService
ors.base-url=https://api.openrouteservice.org
ors.api-key=${ORS_API_KEY}
ors.connect-timeout=5s
ors.read-timeout=15s

# Gemini
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-flash-lite-latest
app.gemini.connect-timeout=5s
app.gemini.read-timeout=30s

# Actuator Health
management.endpoints.web.exposure.include=health,metrics
# Explicit disable — belt-and-braces against future Boot defaults changing:
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump,configprops
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI — docs UI is a dev/demo aid, not exposed in prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-cloud-placeholder}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:dev-key-placeholder}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-secret-placeholder}