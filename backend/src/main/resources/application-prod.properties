# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5


spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.tripflow.backend=INFO

# Server / proxy
# Behind Render/Railway's load balancer the app never sees the real client IP:
# getRemoteAddr() returns the proxy hop, so AuthController's per-IP bucket4j keys
# (login/register) collapse into ONE bucket shared by every caller — a single client
# can burn the whole allowance and lock out the entire deployment for an hour.
# isSecure() is false for the same reason, which suppresses Spring Security's HSTS.
#
# 'native' (Tomcat RemoteIpValve), NOT 'framework' (ForwardedHeaderFilter): only the
# valve has a trusted-proxy allowlist. It walks X-Forwarded-For right-to-left and stops
# at the first entry that doesn't match server.tomcat.remoteip.internal-proxies (private
# ranges by default), so a forged entry — which a client can only prepend, on the left —
# is never reached. ForwardedHeaderFilter trusts the leftmost entry unconditionally,
# letting an attacker mint a fresh bucket per request: a full rate-limit bypass, worse
# than the single-bucket bug this fixes. If the platform ever routes to the container
# from a public address the valve stops trusting the hop and we fall back to today's
# single-bucket behaviour (fail-closed) — widen internal-proxies then, never switch to
# framework. Prod only: nothing strips these headers in dev/test, so they aren't trusted there.
server.forward-headers-strategy=native

# SCRUM-312: Render sits behind Cloudflare (confirmed live: every response carries
# Server: cloudflare), a hop the reasoning above didn't account for. X-Forwarded-Proto
# still resolves correctly because that's a single value trusted off the immediate
# connecting peer (Render's internal LB). But X-Forwarded-For is a chain --
# "<real-client-ip>, <cloudflare-edge-ip>" -- and the valve's right-to-left walk stops
# at the first untrusted entry, which is Cloudflare's edge IP (a public address, not in
# internal-proxies' private-range default). Extending internal-proxies with Cloudflare's
# published ranges would work but means tracking a list Cloudflare rotates. Simpler:
# point the valve at CF-Connecting-IP, Cloudflare's own single-value real-client-IP
# header, set by the edge itself -- not client-controllable, since Render's platform
# edge IS Cloudflare, so there's no direct-to-origin path that skips it.
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:3600000}

# OpenRouteService
ors.base-url=https://api.openrouteservice.org
ors.api-key=${ORS_API_KEY}
ors.connect-timeout=5s
ors.read-timeout=15s

# Gemini
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-flash-lite-latest
app.gemini.connect-timeout=5s
app.gemini.read-timeout=30s

# Actuator Health
management.endpoints.web.exposure.include=health,metrics
# Explicit disable — belt-and-braces against future Boot defaults changing:
management.endpoints.web.exposure.exclude=env,beans,heapdump,threaddump,configprops
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI — docs UI is a dev/demo aid, not exposed in prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}