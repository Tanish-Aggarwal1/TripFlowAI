# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tripflow
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.show-sql=true
logging.level.root=INFO
logging.level.com.tripflow.backend=DEBUG

# Cors
app.cors.allowed-origins=http://localhost:8100

# Cloudinary — optional locally (SCRUM-461): the base application.properties fails fast on
# these like every other secret, so the dev-only placeholder defaults live here instead,
# where a broken/missing prod override can't inherit them.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-cloud-placeholder}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:dev-key-placeholder}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-secret-placeholder}