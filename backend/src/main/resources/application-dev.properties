# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tripflow
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.show-sql=true
logging.level.root=INFO
logging.level.com.tripflow.backend=DEBUG

# Cors
app.cors.allowed-origins=http://localhost:8100

# --- Cloudinary (SCRUM-66a) ---
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}