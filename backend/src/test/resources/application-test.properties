app.gemini.read-timeout=20s

# Rate limiting (SCRUM-173) — low capacity so IT tests can trigger 429 without
# hundreds of requests. Each existing IT test uses a fresh user per test method, so
# this doesn't affect any test that isn't deliberately exercising the rate limiter.
# Kept comfortably above RouteOptimizationConcurrencyIT's 3 same-user concurrent
# /optimize calls, which share this same limit and would otherwise start failing
# the moment that test added one more concurrent request.
app.ratelimit.ai-suggest.capacity=5
app.ratelimit.ai-suggest.window=1h
app.ratelimit.optimize.capacity=5
app.ratelimit.optimize.window=1h
app.ratelimit.ai-generate.capacity=5
app.ratelimit.ai-generate.window=1h
# High capacity in tests: unlike ai-suggest/optimize/ai-generate (called at most
# once or twice per IT method), several auth ITs call register/login many times
# across one test class, and MockMvc requests all share one synthetic remote
# address — a low capacity here would make the shared in-memory bucket trip
# across unrelated test methods instead of exercising real business logic.
app.ratelimit.login.capacity=1000
app.ratelimit.login.window=1h
app.ratelimit.register.capacity=1000
app.ratelimit.register.window=1h
app.ratelimit.refresh.capacity=1000
app.ratelimit.refresh.window=1h
# Same reasoning as login/register/refresh above: IP-keyed (MockMvc requests share one
# synthetic remote address), and DiscoveryControllerIT calls /search from several
# unrelated test methods — high capacity keeps them from tripping the shared bucket.
app.ratelimit.discovery-search.capacity=1000
app.ratelimit.discovery-search.window=1h
# Matches the cloud name existing IT fixtures use in their mock Cloudinary URLs
# (e.g. "https://res.cloudinary.com/demo/..."), so StopPhotoService's URL-host
# validation accepts them. api-key/api-secret have no functional meaning in tests
# (CloudinaryClient is @MockitoBean'd) but must be set now that the base
# application.properties no longer defaults them (SCRUM-461).
app.cloudinary.cloud-name=demo
app.cloudinary.api-key=test-placeholder
app.cloudinary.api-secret=test-placeholder